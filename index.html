<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f10">

<title>سنابل السلطان</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#0b0f10;
color:#fff;
min-height:100vh;
}

button,
input,
textarea{
font-family:inherit;
}

header{
background:#0b0f10;
border-bottom:1px solid #292f32;
padding:15px;
position:sticky;
top:0;
z-index:100;
}

.header-row{
max-width:900px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between;
}

.brand{
display:flex;
align-items:center;
gap:10px;
}

.logo{
width:58px;
height:58px;
border-radius:50%;
border:2px solid #e6ad43;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

.brand-text h1{
font-size:22px;
color:#e8b75a;
}

.brand-text p{
font-size:11px;
color:#aaa;
margin-top:4px;
}

.cart-top{
background:#202629;
border:1px solid #363d41;
border-radius:13px;
padding:9px 14px;
color:white;
font-size:20px;
}

.cart-count{
background:#efbd5a;
color:#111;
display:inline-flex;
align-items:center;
justify-content:center;
width:23px;
height:23px;
border-radius:50%;
font-size:12px;
font-weight:bold;
}

/* HERO */

.hero{
max-width:900px;
margin:auto;
text-align:center;
padding:45px 15px 20px;
}

.hero-logo{
width:195px;
height:195px;
margin:auto;
border:3px solid #e1a93f;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:90px;
background:#15191b;
}

.hero h2{
font-size:38px;
color:#eabb60;
margin-top:28px;
}

.hero p{
font-size:20px;
line-height:2;
color:#ddd;
margin-top:12px;
}

/* CATEGORIES */

.categories{
max-width:900px;
margin:25px auto 15px;
padding:0 14px;
display:flex;
gap:12px;
overflow-x:auto;
}

.categories button{
flex:1;
min-width:110px;
padding:14px 12px;
border:0;
border-radius:15px;
background:#1b2023;
color:#ddd;
font-size:16px;
}

.categories button.active{
background:#efbd5a;
color:#111;
font-weight:bold;
}

/* PRODUCTS */

.container{
max-width:900px;
margin:auto;
padding:15px 14px 110px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:13px;
}

.card{
background:#171c1e;
border:1px solid #363d40;
border-radius:16px;
overflow:hidden;
box-shadow:0 5px 18px #0008;
}

.product-img{
height:145px;
background:linear-gradient(135deg,#342619,#1b1610);
display:flex;
align-items:center;
justify-content:center;
font-size:65px;
}

.card-body{
padding:13px;
}

.card h3{
font-size:16px;
line-height:1.6;
text-align:center;
}

.price{
color:#eabb60;
font-size:18px;
font-weight:bold;
text-align:center;
margin:8px 0 11px;
}

.controls{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin-bottom:10px;
}

.qty{
font-size:17px;
font-weight:bold;
min-width:30px;
text-align:center;
}

.qty-btn{
width:35px;
height:35px;
border:0;
border-radius:9px;
background:#2a3033;
color:white;
font-size:21px;
}

.add-btn{
width:100%;
padding:11px 5px;
border:0;
border-radius:11px;
background:#efbd5a;
color:#111;
font-weight:bold;
font-size:14px;
}

/* BOTTOM NAV */

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:82px;
background:#111618;
border-top:1px solid #303639;
z-index:200;
}

.bottom-inner{
height:100%;
max-width:900px;
margin:auto;
display:flex;
justify-content:space-around;
align-items:center;
}

.nav-btn{
background:none;
border:0;
color:#999;
font-size:13px;
padding:8px 25px;
}

.nav-btn.active{
color:#eabb60;
}

/* PAGES */

.page{
display:none;
}

.page.active{
display:block;
}

/* CART */

.cart{
max-width:700px;
margin:auto;
}

.section-title{
color:#eabb60;
font-size:27px;
margin-bottom:20px;
}

.cart-item{
background:#171c1e;
border:1px solid #363d40;
border-radius:14px;
padding:14px;
margin-bottom:10px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.cart-item-info{
flex:1;
}

.cart-item-name{
font-weight:bold;
font-size:16px;
margin-bottom:6px;
}

.cart-item-qty{
color:#aaa;
font-size:13px;
}

.cart-actions{
display:flex;
align-items:center;
gap:6px;
}

.delete{
background:#672c2c;
color:white;
border:0;
border-radius:8px;
padding:8px;
}

.total-box{
background:#171c1e;
border:1px solid #363d40;
border-radius:15px;
padding:18px;
margin-top:18px;
text-align:center;
}

.total-box small{
display:block;
color:#aaa;
margin-bottom:7px;
}

.total{
font-size:25px;
font-weight:bold;
color:#eabb60;
}

.checkout-btn{
width:100%;
padding:15px;
margin-top:15px;
border:0;
border-radius:13px;
background:#efbd5a;
color:#111;
font-size:17px;
font-weight:bold;
}

/* CHECKOUT */

.checkout{
max-width:700px;
margin:auto;
}

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
margin-bottom:8px;
color:#ddd;
font-size:15px;
}

.form-group input,
.form-group textarea{
width:100%;
background:#272e32;
color:white;
border:1px solid #454d52;
border-radius:12px;
padding:14px;
font-size:16px;
outline:none;
}

.form-group input:focus,
.form-group textarea:focus{
border-color:#eabb60;
}

.location-box{
background:#171c1e;
border:1px solid #363d40;
border-radius:15px;
padding:14px;
margin-bottom:18px;
}

.location-status{
color:#aaa;
margin-bottom:10px;
line-height:1.7;
}

.location-btn{
width:100%;
border:0;
border-radius:11px;
padding:14px;
background:#293135;
color:white;
font-weight:bold;
font-size:15px;
}

.waze-link{
display:none;
margin-top:10px;
background:#19a9df;
color:white;
text-align:center;
padding:13px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.send-btn{
width:100%;
border:0;
border-radius:13px;
padding:16px;
background:#19b957;
color:white;
font-size:17px;
font-weight:bold;
}

/* SUCCESS */

.success{
max-width:650px;
margin:50px auto;
text-align:center;
}

.success-icon{
width:90px;
height:90px;
border:4px solid #19b957;
border-radius:50%;
color:#19b957;
font-size:55px;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
}

.success h2{
margin-top:20px;
font-size:27px;
}

.success p{
color:#aaa;
line-height:2;
margin:12px 0 25px;
}

.success button{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #444;
background:#202629;
color:white;
margin-top:8px;
font-size:15px;
}

@media(min-width:700px){

.products{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:500px){

.hero-logo{
width:195px;
height:195px;
}

.hero h2{
font-size:34px;
}

.hero p{
font-size:18px;
}

.product-img{
height:125px;
}

.card h3{
font-size:15px;
}

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

<div class="header-row">

<div class="brand">

<div class="logo">🌾</div>

<div class="brand-text">

<h1>سنابل السلطان</h1>

<p>مخبوزات وحلويات طازجة يومياً</p>

</div>

</div>

<button class="cart-top" onclick="showPage('cart')">

🛒

<span class="cart-count" id="cartCount">0</span>

</button>

</div>

</header>


<!-- HOME -->

<div id="homePage" class="page active">

<section class="hero">

<div class="hero-logo">🌾</div>

<h2>سنابل السلطان</h2>

<p>
مذاق يصنع الفرق
<br>
مخبوزات وحلويات طازجة يومياً
</p>

</section>


<div class="categories">

<button class="active"
onclick="filterProducts('all',this)">
الكل
</button>

<button onclick="filterProducts('pastry',this)">
المعجنات
</button>

<button onclick="filterProducts('croissant',this)">
الكرواسون
</button>

<button onclick="filterProducts('sweets',this)">
الحلويات
</button>

</div>


<main class="container">

<div class="products" id="products"></div>

</main>

</div>


<!-- CART -->

<div id="cartPage" class="page">

<main class="container">

<div class="cart">

<h2 class="section-title">
🛒 سلة المشتريات
</h2>

<div id="cartItems"></div>

<div class="total-box">

<small>الإجمالي الفرعي</small>

<div class="total" id="totalPrice">
0 د.ع
</div>

</div>

<button class="checkout-btn"
onclick="showPage('checkout')">

إتمام الطلب ←

</button>

</div>

</main>

</div>


<!-- CHECKOUT -->

<div id="checkoutPage" class="page">

<main class="container">

<div class="checkout">

<h2 class="section-title">
تأكيد الطلب
</h2>


<div class="form-group">

<label>
الاسم الكامل
</label>

<input
type="text"
id="customerName"
placeholder="اكتب اسمك الكامل">

</div>


<div class="form-group">

<label>
رقم واتساب
</label>

<input
type="tel"
id="customerPhone"
placeholder="07XXXXXXXXX"
inputmode="numeric">

</div>


<div class="location-box">

<div
class="location-status"
id="locationStatus">

📍 لم يتم تحديد موقعك بعد

</div>


<button
class="location-btn"
onclick="getLocation()">

📍 تحديد موقعي

</button>


<a
id="wazeLink"
class="waze-link"
target="_blank">

🧭 فتح الموقع في Waze

</a>

</div>


<div class="form-group">

<label>
ملاحظات (اختياري)
</label>

<textarea
id="notes"
rows="4"
placeholder="أي ملاحظات على الطلب..."></textarea>

</div>


<button
class="send-btn"
onclick="sendOrder()">

🟢 إرسال الطلب عبر واتساب

</button>

</div>

</main>

</div>


<!-- SUCCESS -->

<div id="successPage" class="page">

<main class="container">

<div class="success">

<div class="success-icon">
✓
</div>

<h2>
تم إرسال طلبك بنجاح
</h2>

<p>
سيتم التواصل معك قريباً عبر واتساب
<br>
لتأكيد الطلب والتوصيل.
</p>


<button onclick="openWaze()">

🧭 فتح موقعي في Waze

</button>


<button onclick="showPage('home')">

🏠 العودة للرئيسية

</button>

</div>

</main>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

<div class="bottom-inner">

<button
class="nav-btn active"
onclick="showPage('home')">

🏠
<br>
الرئيسية

</button>


<button
class="nav-btn"
onclick="showPage('home')">

🛍️
<br>
المنتجات

</button>


<button
class="nav-btn"
onclick="showPage('cart')">

🛒
<br>
السلة

</button>


<button
class="nav-btn"
onclick="alert('07876388878')">

📞
<br>
اتصل بنا

</button>

</div>

</nav>


<script>

/* =========================
   رقم واتساب سنابل السلطان
========================= */

const BUSINESS_WHATSAPP = "9647876388878";

let userLocation = null;

let cart = [];


/* =========================
   المنتجات
========================= */

const products = [

{
id:1,
name:"كيلو بيتي فور",
price:12000,
category:"sweets",
icon:"🍪"
},

{
id:2,
name:"كيلو تارت",
price:12000,
category:"sweets",
icon:"🍰"
},

{
id:3,
name:"كرواسون شوكيو",
price:1500,
category:"croissant",
icon:"🥐"
},

{
id:4,
name:"كرواسون نوتيلا",
price:1500,
category:"croissant",
icon:"🥐"
},

{
id:5,
name:"صمون بركر شوفان",
price:1000,
category:"pastry",
icon:"🍔"
},

{
id:6,
name:"صمون كهرماني صغير",
price:1000,
category:"pastry",
icon:"🥖"
},

{
id:7,
name:"صمون بركر عادي",
price:1000,
category:"pastry",
icon:"🍔"
},

{
id:8,
name:"صمون شعير",
price:1000,
category:"pastry",
icon:"🥖"
},

{
id:9,
name:"كرواسون سادة",
price:1500,
category:"croissant",
icon:"🥐"
},

{
id:10,
name:"جرك حلاوة وقمر",
price:750,
category:"sweets",
icon:"🍬"
}

];


/* =========================
   عرض المنتجات
========================= */

function renderProducts(list){

const box =
document.getElementById("products");

box.innerHTML = "";

list.forEach(function(product){

const existing =
cart.find(function(item){
return item.id === product.id;
});

const qty =
existing ? existing.qty : 1;


box.innerHTML += `

<div class="card">

<div class="product-img">
${product.icon}
</div>

<div class="card-body">

<h3>
${product.name}
</h3>

<div class="price">
${product.price.toLocaleString("ar-IQ")} د.ع
</div>

<div class="controls">

<button
class="qty-btn"
onclick="changeProductQty(${product.id},-1)">
−
</button>

<div
class="qty"
id="qty-${product.id}">
${qty}
</div>

<button
class="qty-btn"
onclick="changeProductQty(${product.id},1)">
+
</button>

</div>

<button
class="add-btn"
onclick="addToCart(${product.id})">

إضافة للسلة 🛒

</button>

</div>

</div>

`;

});

}


/* =========================
   الفلترة
========================= */

function filterProducts(category,btn){

document
.querySelectorAll(".categories button")
.forEach(function(button){

button.classList.remove("active");

});

btn.classList.add("active");


if(category === "all"){

renderProducts(products);

return;

}


renderProducts(
products.filter(function(product){

return product.category === category;

})
);

}


/* =========================
   تغيير كمية المنتج
========================= */

function changeProductQty(id,value){

const element =
document.getElementById("qty-"+id);

if(!element) return;

let qty =
parseInt(element.innerText);

qty += value;

if(qty < 1){
qty = 1;
}

element.innerText = qty;

}


/* =========================
   إضافة للسلة
========================= */

function addToCart(id){

const product =
products.find(function(item){

return item.id === id;

});

if(!product) return;


const qtyElement =
document.getElementById("qty-"+id);

const qty =
parseInt(qtyElement.innerText);


const existing =
cart.find(function(item){

return item.id === id;

});


if(existing){

existing.qty += qty;

}else{

cart.push({

id:product.id,
name:product.name,
price:product.price,
icon:product.icon,
qty:qty

});

}


updateCartCount();

alert("تمت إضافة المنتج إلى السلة ✅");

}


/* =========================
   عدد السلة
========================= */

function updateCartCount(){

const count =
cart.reduce(function(total,item){

return total + item.qty;

},0);


document.getElementById("cartCount")
.innerText = count;

}


/* =========================
   عرض السلة
========================= */

function renderCart(){

const box =
document.getElementById("cartItems");

box.innerHTML = "";


if(cart.length === 0){

box.innerHTML = `

<div style="
text-align:center;
padding:50px 10px;
color:#aaa;">

🛒

<br><br>

السلة فارغة

</div>

`;

document.getElementById("totalPrice")
.innerText = "0 د.ع";

return;

}


cart.forEach(function(item){

box.innerHTML += `

<div class="cart-item">

<div class="cart-item-info">

<div class="cart-item-name">

${item.icon} ${item.name}

</div>

<div class="cart-item-qty">

الكمية: ${item.qty}

</div>

</div>


<div class="cart-actions">

<button
class="qty-btn"
onclick="cartQty(${item.id},-1)">
−
</button>

<b>${item.qty}</b>

<button
class="qty-btn"
onclick="cartQty(${item.id},1)">
+
</button>

<button
class="delete"
onclick="removeFromCart(${item.id})">

🗑

</button>

</div>

</div>

`;

});


const total =
cart.reduce(function(sum,item){

return sum + item.price * item.qty;

},0);


document.getElementById("totalPrice")
.innerText =
total.toLocaleString("ar-IQ") + " د.ع";

}


/* =========================
   كمية السلة
========================= */

function cartQty(id,value){

const item =
cart.find(function(product){

return product.id === id;

});

if(!item) return;


item.qty += value;


if(item.qty <= 0){

cart =
cart.filter(function(product){

return product.id !== id;

});

}


updateCartCount();

renderCart();

}


/* =========================
   حذف
========================= */

function removeFromCart(id){

cart =
cart.filter(function(item){

return item.id !== id;

});

updateCartCount();

renderCart();

}


/* =========================
   الصفحات
========================= */

function showPage(page){

document
.querySelectorAll(".page")
.forEach(function(p){

p.classList.remove("active");

});


if(page === "home"){

document
.getElementById("homePage")
.classList.add("active");

window.scrollTo(0,0);

}


if(page === "cart"){

document
.getElementById("cartPage")
.classList.add("active");

renderCart();

window.scrollTo(0,0);

}


if(page === "checkout"){

if(cart.length === 0){

alert("السلة فارغة");

showPage("home");

return;

}

document
.getElementById("checkoutPage")
.classList.add("active");

window.scrollTo(0,0);

}


if(page === "success"){

document
.getElementById("successPage")
.classList.add("active");

window.scrollTo(0,0);

}

}


/* =========================
   تحديد الموقع
   WAZE فقط
========================= */

function getLocation(){

const status =
document.getElementById("locationStatus");

const waze =
document.getElementById("wazeLink");


if(!navigator.geolocation){

status.innerText =
"❌ جهازك لا يدعم تحديد الموقع";

return;

}


status.innerText =
"📍 جاري تحديد موقعك...";


navigator.geolocation.getCurrentPosition(

function(position){

const lat =
position.coords.latitude;

const lon =
position.coords.longitude;


userLocation = {

lat:lat,
lon:lon

};


status.innerText =
"✅ تم تحديد موقعك بنجاح";


/* WAZE فقط */

const wazeUrl =
"https://waze.com/ul?ll="
+
lat
+
","
+
lon
+
"&navigate=yes";


waze.href = wazeUrl;

waze.style.display = "block";

},

function(){

status.innerText =
"❌ تعذر تحديد الموقع، فعّل GPS وحاول مرة ثانية";

},

{

enableHighAccuracy:true,
timeout:15000,
maximumAge:0

}

);

}


/* =========================
   فتح Waze
========================= */

function openWaze(){

if(!userLocation){

alert("حدد موقعك أولاً");

showPage("checkout");

return;

}


const url =
"https://waze.com/ul?ll="
+
userLocation.lat
+
","
+
userLocation.lon
+
"&navigate=yes";


window.open(url,"_blank");

}


/* =========================
   إرسال الطلب
========================= */

function sendOrder(){

const name =
document
.getElementById("customerName")
.value
.trim();


const phone =
document
.getElementById("customerPhone")
.value
.trim();


const notes =
document
.getElementById("notes")
.value
.trim();


if(!name){

alert("اكتب اسمك الكامل");

return;

}


if(!phone){

alert("اكتب رقم واتساب الخاص بك");

return;

}


if(!/^07[0-9]{9}$/.test(phone)){

alert("اكتب رقم واتساب صحيح مثل 07876388878");

return;

}


if(!userLocation){

alert("حدد موقعك أولاً حتى يتم إرسال موقع Waze");

return;

}


if(cart.length === 0){

alert("السلة فارغة");

return;

}


/*
   قائمة الطلب
