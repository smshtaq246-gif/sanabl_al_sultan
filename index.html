<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0b0f10">

<title>سنابل السلطان</title>

<style>

/* =========================
   GENERAL
========================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#0b0f10;
  color:#fff;
  min-height:100vh;
  padding-bottom:80px;
}

button,
input,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}


/* =========================
   HEADER
========================= */

header{
  background:#0b0f10;
  border-bottom:1px solid #292f32;
  padding:15px;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-row{
  max-width:900px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:64px;
  height:64px;

  border:2px solid #dca947;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:32px;

  background:#15191b;
}

.brand-text h1{
  color:#e8b85b;
  font-size:23px;
  margin-bottom:5px;
}

.brand-text p{
  color:#aaa;
  font-size:12px;
}

.cart-top{
  background:#202629;
  border:1px solid #363d40;
  border-radius:14px;

  min-width:90px;
  height:60px;

  color:#fff;
  font-size:23px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.cart-count{
  width:28px;
  height:28px;

  border-radius:50%;

  background:#efbd5a;
  color:#111;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:14px;
  font-weight:bold;
}


/* =========================
   PAGES
========================= */

.page{
  display:none;
}

.page.active{
  display:block;
}


/* =========================
   HERO
========================= */

.hero{
  max-width:900px;
  margin:auto;

  text-align:center;

  padding:55px 18px 25px;
}

.hero-logo{
  width:195px;
  height:195px;

  margin:auto;

  border:3px solid #dca947;
  border-radius:50%;

  background:#15191b;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:100px;

  box-shadow:
    0 0 0 1px #171b1d,
    0 15px 40px #0008;
}

.hero h2{
  margin-top:40px;

  color:#efbd5a;

  font-size:44px;
  font-weight:bold;
}

.hero p{
  margin-top:15px;

  color:#ddd;

  font-size:22px;
  line-height:1.9;
}


/* =========================
   CATEGORIES
========================= */

.categories{
  max-width:900px;

  margin:25px auto 10px;

  padding:0 15px;

  display:flex;

  gap:12px;

  overflow-x:auto;

  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.categories button{
  flex:1;

  min-width:120px;

  padding:15px 20px;

  border:0;

  border-radius:15px;

  background:#1a2023;

  color:#ddd;

  font-size:17px;
}

.categories button.active{
  background:#efbd5a;
  color:#111;
  font-weight:bold;
}


/* =========================
   CONTAINER
========================= */

.container{
  max-width:900px;

  margin:auto;

  padding:25px 15px 110px;
}


/* =========================
   PRODUCTS
========================= */

.products{
  display:grid;

  grid-template-columns:
  repeat(2,minmax(0,1fr));

  gap:15px;
}

.card{
  background:#171c1e;

  border:1px solid #343b3f;

  border-radius:18px;

  overflow:hidden;

  box-shadow:0 7px 22px #0008;
}

.product-img{
  height:145px;

  background:
    radial-gradient(
      circle at center,
      #4a321c,
      #1b1712
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:72px;
}

.card-body{
  padding:14px;
}

.card h3{
  font-size:17px;

  line-height:1.6;

  margin-bottom:7px;
}

.price{
  color:#efbd5a;

  font-size:18px;

  font-weight:bold;

  margin-bottom:12px;
}

.controls{
  display:flex;

  align-items:center;

  gap:8px;

  margin-bottom:10px;
}

.qty{
  flex:1;

  text-align:center;

  font-size:17px;

  font-weight:bold;
}

.qty-btn{
  width:36px;
  height:36px;

  border:0;

  border-radius:9px;

  background:#2b3236;

  color:#fff;

  font-size:21px;
}

.add-btn{
  width:100%;

  padding:12px 5px;

  border:0;

  border-radius:11px;

  background:#efbd5a;

  color:#111;

  font-size:15px;

  font-weight:bold;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
  position:fixed;

  bottom:0;
  right:0;
  left:0;

  height:82px;

  z-index:2000;

  background:#111618;

  border-top:1px solid #303639;
}

.bottom-inner{
  max-width:900px;

  width:100%;
  height:100%;

  margin:auto;

  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-btn{
  flex:1;

  height:100%;

  border:0;

  background:none;

  color:#aaa;

  font-size:15px;

  line-height:1.6;
}

.nav-btn.active{
  color:#efbd5a;
}


/* =========================
   TITLES
========================= */

.section-title{
  color:#efbd5a;

  font-size:28px;

  margin-bottom:20px;

  text-align:center;
}


/* =========================
   CART
========================= */

.cart{
  max-width:700px;

  margin:auto;
}

.cart-item{
  background:#171c1e;

  border:1px solid #343b3f;

  border-radius:15px;

  padding:15px;

  margin-bottom:12px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-size:16px;

  font-weight:bold;

  margin-bottom:6px;
}

.cart-item-qty{
  color:#aaa;

  font-size:13px;
}

.cart-actions{
  display:flex;

  align-items:center;

  gap:6px;
}

.delete{
  border:0;

  background:#682e2e;

  color:#fff;

  border-radius:8px;

  padding:9px;
}

.total-box{
  background:#171c1e;

  border:1px solid #343b3f;

  border-radius:15px;

  padding:20px;

  margin-top:20px;

  text-align:center;
}

.total-box small{
  display:block;

  color:#aaa;

  margin-bottom:8px;
}

.total{
  color:#efbd5a;

  font-size:27px;

  font-weight:bold;
}

.checkout-btn{
  width:100%;

  margin-top:15px;

  padding:16px;

  border:0;

  border-radius:13px;

  background:#efbd5a;

  color:#111;

  font-size:18px;

  font-weight:bold;
}


/* =========================
   CHECKOUT
========================= */

.checkout{
  max-width:700px;

  margin:auto;
}

.form-group{
  margin-bottom:18px;
}

.form-group label{
  display:block;

  margin-bottom:9px;

  color:#ddd;

  font-size:15px;
}

.form-group input,
.form-group textarea{
  width:100%;

  background:#272e32;

  color:#fff;

  border:1px solid #454d52;

  border-radius:13px;

  padding:15px;

  font-size:17px;

  outline:none;
}

.form-group input::placeholder,
.form-group textarea::placeholder{
  color:#8d9396;
}

.form-group input:focus,
.form-group textarea:focus{
  border-color:#efbd5a;
}


/* =========================
   LOCATION
========================= */

.location-box{
  background:#171c1e;

  border:1px solid #343b3f;

  border-radius:15px;

  padding:15px;

  margin-bottom:18px;
}

.location-status{
  color:#aaa;

  margin-bottom:12px;

  line-height:1.7;
}

.location-btn{
  width:100%;

  border:0;

  border-radius:12px;

  padding:14px;

  background:#293135;

  color:#fff;

  font-size:16px;

  font-weight:bold;
}

.waze-link{
  display:none;

  margin-top:10px;

  background:#21a8e0;

  color:#fff;

  text-align:center;

  padding:14px;

  border-radius:11px;

  text-decoration:none;

  font-weight:bold;
}


/* =========================
   SEND
========================= */

.send-btn{
  width:100%;

  border:0;

  border-radius:13px;

  padding:16px;

  background:#19b957;

  color:#fff;

  font-size:17px;

  font-weight:bold;
}


/* =========================
   SUCCESS
========================= */

.success{
  max-width:650px;

  margin:70px auto;

  text-align:center;
}

.success-icon{
  width:95px;
  height:95px;

  margin:auto;

  border:4px solid #19b957;

  border-radius:50%;

  color:#19b957;

  font-size:55px;

  display:flex;

  align-items:center;
  justify-content:center;
}

.success h2{
  margin-top:22px;

  font-size:28px;
}

.success p{
  color:#aaa;

  line-height:1.9;

  margin:12px 0 25px;
}

.success button{
  width:100%;

  padding:15px;

  border-radius:12px;

  border:1px solid #444;

  background:#202629;

  color:#fff;

  margin-top:9px;

  font-size:16px;
}

.success button:first-of-type{
  background:#21a8e0;

  border:0;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  header{
    padding:13px;
  }

  .logo{
    width:60px;
    height:60px;
  }

  .brand-text h1{
    font-size:20px;
  }

  .brand
