<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f10">
<title>سنابل السلطان | الطلبات</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#0b0f10;
  color:#fff;
  min-height:100vh;
}

button,input,textarea{
  font-family:inherit;
}

header{
  background:#0b0f10;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid #242a2d;
}

.header-row{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:52px;
  height:52px;
  border-radius:50%;
  border:2px solid #d9a441;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.brand-text h1{
  color:#e8b85b;
  font-size:21px;
}

.brand-text p{
  color:#aaa;
  font-size:11px;
  margin-top:4px;
}

.cart-top{
  background:#202629;
  border:1px solid #353c40;
  color:#fff;
  border-radius:12px;
  padding:10px 14px;
  font-size:20px;
  cursor:pointer;
}

.cart-count{
  background:#e8b85b;
  color:#111;
  border-radius:50%;
  min-width:20px;
  height:20px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
  margin-right:3px;
}

.hero{
  max-width:900px;
  margin:auto;
  padding:30px 18px 20px;
  text-align:center;
}

.hero-logo{
  width:105px;
  height:105px;
  border-radius:50%;
  margin:auto;
  border:2px solid #dca947;
  background:#15191b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
}

.hero h2{
  color:#e9b85d;
  font-size:32px;
  margin-top:18px;
}

.hero p{
  color:#ddd;
  margin-top:8px;
  line-height:1.8;
}

.categories{
  max-width:900px;
  margin:15px auto 5px;
  padding:0 14px;
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.categories button{
  flex-shrink:0;
  border:0;
  background:#1b2023;
  color:#ddd;
  padding:10px 18px;
  border-radius:10px;
  cursor:pointer;
}

.categories button.active{
  background:#e8b85b;
  color:#111;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px 14px 110px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:#171c1e;
  border:1px solid #333a3e;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 5px 18px #0008;
}

.product-img{
  height:145px;
  background:linear-gradient(135deg,#382a1b,#1c1711);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

.card-body{
  padding:12px;
}

.card h3{
  font-size:16px;
  margin-bottom:5px;
  line-height:1.5;
}

.price{
  color:#e9b85d;
  font-weight:bold;
  font-size:17px;
  margin-bottom:10px;
}

.controls{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:9px;
}

.qty{
  flex:1;
  text-align:center;
  font-weight:bold;
}

.qty-btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:9px;
  background:#2a3033;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}

.add-btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:11px 5px;
  background:#e8b85b;
  color:#111;
  font-weight:bold;
  cursor:pointer;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  right:0;
  left:0;
  z-index:200;
  background:#111618;
  border-top:1px solid #303639;
  display:flex;
  justify-content:center;
}

.bottom-inner{
  width:100%;
  max-width:900px;
  display:flex;
  justify-content:space-around;
}

.nav-btn{
  background:none;
  border:0;
  color:#aaa;
  padding:12px 25px;
  font-size:13px;
  cursor:pointer;
}

.nav-btn.active{
  color:#e8b85b;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* CART */

.cart{
  max-width:700px;
  margin:auto;
}

.section-title{
  color:#e8b85b;
  font-size:25px;
  margin-bottom:18px;
}

.cart-item{
  background:#171c1e;
  border:1px solid #333a3e;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.cart-item-info{
  flex:1;
}

.cart-item-name{
  font-weight:bold;
  margin-bottom:5px;
}

.cart-item-qty{
  color:#aaa;
  font-size:13px;
}

.cart-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.delete{
  background:#662c2c;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:8px;
}

.total-box{
  background:#171c1e;
  border:1px solid #333a3e;
  border-radius:15px;
  padding:18px;
  margin-top:18px;
  text-align:center;
}

.total-box small{
  display:block;
  color:#aaa;
  margin-bottom:7px;
}

.total{
  color:#e8b85b;
  font-size:25px;
  font-weight:bold;
}

.checkout-btn{
  width:100%;
  margin-top:15px;
  padding:15px;
  border:0;
  border-radius:13px;
  background:#e8b85b;
  color:#111;
  font-size:17px;
  font-weight:bold;
}

/* CHECKOUT */

.checkout{
  max-width:700px;
  margin:auto;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  margin-bottom:8px;
  color:#ddd;
}

.form-group input,
.form-group textarea{
  width:100%;
  background:#272e32;
  color:#fff;
  border:1px solid #454d52;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  outline:none;
}

.form-group input:focus,
.form-group textarea:focus{
  border-color:#e8b85b;
}

.location-box{
  background:#171c1e;
  border:1px solid #333a3e;
  border-radius:15px;
  padding:14px;
  margin-bottom:17px;
}

.location-status{
  color:#aaa;
  margin-bottom:10px;
}

.location-btn{
  width:100%;
  border:0;
  border-radius:11px;
  padding:13px;
  background:#263034;
  color:#fff;
  font-weight:bold;
}

.waze-link{
  display:none;
  margin-top:10px;
  background:#21a8e0;
  color:#fff;
  text-align:center;
  padding:12px;
  border-radius:10px;
  text-decoration:none;
}

.send-btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  background:#19b957;
  color:#fff;
  font-size:17px;
  font-weight:bold;
}

/* SUCCESS */

.success{
  max-width:650px;
  margin:50px auto;
  text-align:center;
}

.success-icon{
  width:90px;
  height:90px;
  border-radius:50%;
  border:4px solid #19b957;
  color:#19b957;
  font-size:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
}

.success h2{
  margin-top:20px;
  font-size:27px;
}

.success p{
  color:#aaa;
  line-height:1.8;
  margin:10px 0 25px;
}

.success button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #444;
  background:#202629;
  color:#fff;
  margin-top:8px;
}

/* DESKTOP */

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

/* MOBILE */

@media(max-width:500px){

  .brand-text h1{
    font-size:18px;
  }

  .hero h2{
    font-size:28px;
  }

  .product-img{
    height:125px;
  }

  .card h3{
    font-size:15px;
  }

}
</style>
</head>

<body>

<header>

  <div class="header-row">

    <div class="brand">

      <div class="logo">🌾</div>

      <div class="brand-text">
        <h1>سنابل السلطان</h1>
        <p>مخبوزات وحلويات طازجة يومياً</p>
      </div>

    </div>

    <button class="cart-top" onclick="showPage('cart')">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>

  </div>

</header>


<!-- HOME -->

<div id="homePage" class="page active">

  <section class="hero">

    <div class="hero-logo">🌾</div>

    <h2>سنابل السلطان</h2>

    <p>
      مذاق يصنع الفرق
      <br>
      مخبوزات وحلويات طازجة يومياً
    </p>

  </section>


  <div class="categories">

    <button class="active"
      onclick="filterProducts('all',this)">
      الكل
    </button>

    <button onclick="filterProducts('pastry',this)">
      المعجنات
    </button>

    <button onclick="filterProducts('croissant',this)">
      الكرواسون
    </button>

    <button onclick="filterProducts('sweets',this)">
      الحلويات
    </button>

  </div>


  <main class="container">

    <div class="products" id="products"></div>

  </main>

</div>


<!-- CART -->

<div id="cartPage" class="page">

  <main class="container">

    <div class="cart">

      <h2 class="section-title">
        🛒 سلة المشتريات
      </h2>

      <div id="cartItems"></div>

      <div class="total-box">

        <small>الإجمالي الفرعي</small>

        <div class="total" id="totalPrice">
          0 د.ع
        </div>

      </div>

      <button
        class="checkout-btn"
        onclick="showPage('checkout')">
        إتمام الطلب ←
      </button>

    </div>

  </main>

</div>


<!-- CHECKOUT -->

<div id="checkoutPage" class="page">

  <main class="container">

    <div class="checkout">

      <h2 class="section-title">
        تأكيد الطلب
      </h2>


      <div class="form-group">

        <label>الاسم الكامل</label>

        <input
          type="text"
          id="customerName"
          placeholder="اكتب اسمك الكامل"
          autocomplete="name">

      </div>


      <div class="form-group">

        <label>رقم واتساب</label>

        <!-- مهم: لا يوجد value هنا -->
        <input
          type="tel"
          id="customerPhone"
          placeholder="07XXXXXXXXX"
          inputmode="numeric"
          autocomplete="tel"
          value="">

      </div>


      <div class="location-box">

        <div
          class="location-status"
          id="locationStatus">
          📍 لم يتم تحديد موقعك بعد
        </div>


        <button
          class="location-btn"
          onclick="getLocation()">
          📍 تحديد موقعي
        </button>


        <!-- WAZE فقط -->

        <a
          id="wazeLink"
          class="waze-link"
          target="_blank"
          rel="noopener">
          🧭 فتح الموقع في Waze
        </a>

      </div>


      <div class="form-group">

        <label>ملاحظات (اختياري)</label>

        <textarea
          id="notes"
          rows="4"
          placeholder="أي ملاحظات على الطلب..."></textarea>

      </div>


      <button
        class="send-btn"
        onclick="sendOrder()">
        🟢 إرسال الطلب عبر واتساب
      </button>

    </div>

  </main>

</div>


<!-- SUCCESS -->

<div id="successPage" class="page">

  <main class="container">

    <div class="success">

      <div class="success-icon">
        ✓
      </div>

      <h2>
        تم إرسال طلبك بنجاح
      </h2>

      <p>
        سيتم التواصل معك قريباً عبر واتساب
        <br>
        لتأكيد الطلب والتوصيل.
      </p>


      <button onclick="openWaze()">
        🧭 فتح موقعي في Waze
      </button>


      <button onclick="showPage('home')">
        🏠 العودة للرئيسية
      </button>

    </div>

  </main>

</div>


<!-- NAV -->

<nav class="bottom-nav">

  <div class="bottom-inner">

    <button
      class="nav-btn active"
      onclick="showPage('home')">
      🏠<br>
      الرئيسية
    </button>


    <button
      class="nav-btn"
      onclick="showPage('home')">
      🛍️<br>
      المنتجات
    </button>


    <button
      class="nav-btn"
      onclick="showPage('cart')">
      🛒<br>
      السلة
