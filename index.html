<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f10">
<title>سنابل السلطان</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#0b0f10;color:#fff}
body{font-family:Tahoma,Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}

header{
  position:sticky;top:0;z-index:50;
  background:#0b0f10;border-bottom:1px solid #292f32;
  padding:14px;
}
.header{
  max-width:900px;margin:auto;display:flex;align-items:center;
  justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:58px;height:58px;border:2px solid #e5ad43;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:31px;
  background:#151a1c;
}
.brand h1{color:#e8b451;font-size:22px}
.brand p{color:#aaa;font-size:12px;margin-top:4px}
.cart-top{
  border:1px solid #3b4245;background:#202629;color:#fff;
  border-radius:14px;padding:9px 14px;font-size:20px;
}
.cart-count{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:22px;height:22px;border-radius:50%;background:#e8b451;color:#111;
  font-size:12px;font-weight:bold;margin-left:4px;
}

.page{display:none}
.page.active{display:block}

.hero{
  max-width:900px;margin:auto;text-align:center;padding:42px 16px 22px;
}
.hero-logo{
  width:150px;height:150px;margin:auto;border:3px solid #e5ad43;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#151a1c;font-size:70px;
}
.hero h2{color:#e8b451;font-size:40px;margin-top:24px}
.hero .slogan{font-size:25px;margin-top:18px}
.hero .sub{color:#ddd;font-size:19px;margin-top:8px}

.categories{
  max-width:900px;margin:12px auto 0;padding:0 14px;
  display:flex;gap:10px;overflow-x:auto;
}
.categories button{
  flex:1;min-width:115px;border:0;border-radius:14px;
  padding:14px 18px;background:#1b2023;color:#ddd;
}
.categories button.active{background:#e8b451;color:#111;font-weight:bold}

.container{max-width:900px;margin:auto;padding:22px 14px 110px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{
  overflow:hidden;background:#171c1e;border:1px solid #343b3f;
  border-radius:16px;box-shadow:0 5px 18px #0007;
}
.product-img{
  height:145px;background:linear-gradient(135deg,#49351e,#211912);
  display:flex;align-items:center;justify-content:center;font-size:65px;
}
.card-body{padding:12px}
.card h3{font-size:16px;line-height:1.5;margin-bottom:6px}
.price{color:#e8b451;font-size:17px;font-weight:bold;margin-bottom:9px}
.controls{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.qty-btn{
  width:36px;height:36px;border:0;border-radius:9px;
  background:#2a3033;color:#fff;font-size:20px;
}
.qty{flex:1;text-align:center;font-weight:bold}
.add-btn{
  width:100%;padding:11px 5px;border:0;border-radius:10px;
  background:#e8b451;color:#111;font-weight:bold;
}

.cart,.checkout{max-width:700px;margin:auto}
.section-title{color:#e8b451;font-size:26px;margin-bottom:18px}
.cart-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px;margin-bottom:10px;background:#171c1e;
  border:1px solid #343b3f;border-radius:14px;
}
.cart-info{flex:1}
.cart-name{font-weight:bold;margin-bottom:5px}
.cart-qty{color:#aaa;font-size:13px}
.cart-actions{display:flex;align-items:center;gap:6px}
.delete{background:#662c2c;color:#fff;border:0;border-radius:8px;padding:8px}
.total-box{
  margin-top:18px;padding:18px;text-align:center;background:#171c1e;
  border:1px solid #343b3f;border-radius:15px;
}
.total-box small{display:block;color:#aaa;margin-bottom:7px}
.total{color:#e8b451;font-size:25px;font-weight:bold}
.checkout-btn{
  width:100%;margin-top:15px;padding:15px;border:0;border-radius:13px;
  background:#e8b451;color:#111;font-weight:bold;font-size:17px;
}

.form-group{margin-bottom:17px}
.form-group label{display:block;color:#ddd;margin-bottom:8px}
.form-group input,.form-group textarea{
  width:100%;background:#272e32;color:#fff;border:1px solid #454d52;
  border-radius:12px;padding:14px;font-size:16px;outline:none;
}
.form-group input:focus,.form-group textarea:focus{border-color:#e8b451}
.location-box{
  background:#171c1e;border:1px solid #343b3f;border-radius:15px;
  padding:14px;margin-bottom:17px;
}
.location-status{color:#aaa;margin-bottom:10px}
.location-btn{
  width:100%;border:0;border-radius:11px;padding:13px;
  background:#263034;color:#fff;font-weight:bold;
}
.waze-link{
  display:none;margin-top:10px;background:#21a8e0;color:#fff;
  text-align:center;padding:12px;border-radius:10px;text-decoration:none;
}
.send-btn{
  width:100%;border:0;border-radius:13px;padding:15px;
  background:#19b957;color:#fff;font-weight:bold;font-size:17px;
}

.success{max-width:650px;margin:45px auto;text-align:center}
.success-icon{
  width:90px;height:90px;border-radius:50%;border:4px solid #19b957;
  color:#19b957;font-size:55px;display:flex;align-items:center;
  justify-content:center;margin:auto;
}
.success h2{margin-top:20px;font-size:27px}
.success p{color:#aaa;line-height:1.8;margin:10px 0 25px}
.success button{
  width:100%;padding:14px;border-radius:12px;border:1px solid #444;
  background:#202629;color:#fff;margin-top:8px;
}

.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#111618;border-top:1px solid #303639;
}
.bottom-inner{max-width:900px;margin:auto;display:flex;justify-content:space-around}
.nav-btn{
  flex:1;background:none;border:0;color:#aaa;padding:12px 8px;font-size:14px;
}
.nav-btn.active{color:#e8b451}

.empty{text-align:center;padding:50px 10px;color:#aaa}

@media(min-width:700px){.products{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){
  .brand h1{font-size:19px}
  .brand p{font-size:10px}
  .hero{padding-top:38px}
  .hero-logo{width:140px;height:140px}
  .hero h2{font-size:34px}
  .hero .slogan{font-size:22px}
  .hero .sub{font-size:17px}
  .product-img{height:125px}
  .card h3{font-size:15px}
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="brand">
      <div class="logo">🌾</div>
      <div>
        <h1>سنابل السلطان</h1>
        <p>مخبوزات وحلويات طازجة يومياً</p>
      </div>
    </div>
    <button class="cart-top" onclick="showPage('cart')">
      🛒 <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<section id="homePage" class="page active">
  <div class="hero">
    <div class="hero-logo">🌾</div>
    <h2>سنابل السلطان</h2>
    <div class="slogan">مذاق يصنع الفرق</div>
    <div class="sub">مخبوزات وحلويات طازجة يومياً</div>
  </div>

  <div class="categories">
    <button class="active" onclick="filterProducts('all',this)">الكل</button>
    <button onclick="filterProducts('pastry',this)">المعجنات</button>
    <button onclick="filterProducts('croissant',this)">الكرواسون</button>
    <button onclick="filterProducts('sweets',this)">الحلويات</button>
  </div>

  <main class="container">
    <div class="products" id="products"></div>
  </main>
</section>

<section id="cartPage" class="page">
  <main class="container">
    <div class="cart">
      <h2 class="section-title">🛒 سلة المشتريات</h2>
      <div id="cartItems"></div>
      <div class="total-box">
        <small>الإجمالي الفرعي</small>
        <div class="total" id="totalPrice">0 د.ع</div>
      </div>
      <button class="checkout-btn" onclick="showPage('checkout')">إتمام الطلب ←</button>
    </div>
  </main>
</section>

<section id="checkoutPage" class="page">
  <main class="container">
    <div class="checkout">
      <h2 class="section-title">تأكيد الطلب</h2>

      <div class="form-group">
        <label>الاسم الكامل</label>
        <input id="customerName" type="text" placeholder="اكتب اسمك الكامل" autocomplete="name">
      </div>

      <div class="form-group">
        <label>رقم واتساب الزبون</label>
        <input id="customerPhone" type="tel" placeholder="07XXXXXXXXX" inputmode="numeric" autocomplete="tel">
      </div>

      <div class="location-box">
        <div class="location-status" id="locationStatus">📍 لم يتم تحديد موقعك بعد</div>
        <button class="location-btn" onclick="getLocation()">📍 تحديد موقعي</button>
        <a id="wazeLink" class="waze-link" target="_blank" rel="noopener">🧭 فتح الموقع في Waze</a>
      </div>

      <div class="form-group">
        <label>ملاحظات (اختياري)</label>
        <textarea id="notes" rows="4" placeholder="أي ملاحظات على الطلب..."></textarea>
      </div>

      <button class="send-btn" onclick="sendOrder()">🟢 إرسال الطلب عبر واتساب</button>
    </div>
  </main>
</section>

<section id="successPage" class="page">
  <main class="container">
    <div class="success">
      <div class="success-icon">✓</div>
      <h2>تم إرسال طلبك بنجاح</h2>
      <p>سيتم التواصل معك قريباً عبر واتساب لتأكيد الطلب والتوصيل.</p>
      <button onclick="openWaze()">🧭 فتح موقعي في Waze</button>
      <button onclick="showPage('home')">🏠 العودة للرئيسية</button>
    </div>
  </main>
</section>

<nav class="bottom-nav">
  <div class="bottom-inner">
    <button class="nav-btn active" onclick="showPage('home')">🏠<br>الرئيسية</button>
    <button class="nav-btn" onclick="showPage('home');scrollToProducts()">🛍️<br>المنتجات</button>
    <button class="nav-btn" onclick="showPage('cart')">🛒<br>السلة</button>
    <button class="nav-btn" onclick="alert('للطلب والاستفسار: 07876388878')">📞<br>اتصل بنا</button>
  </div>
</nav>

<script>
"use strict";

const BUSINESS_WHATSAPP = "9647876388878";
let userLocation = null;
let cart = [];

const products = [
  {id:1,name:"كيلو بيتي فور",price:12000,category:"sweets",icon:"🍪"},
  {id:2,name:"كيلو تارت",price:12000,category:"sweets",icon:"🍰"},
  {id:3,name:"كرواسون شوكيو",price:1500,category:"croissant",icon:"🥐"},
  {id:4,name:"كرواسون نوتيلا",price:1500,category:"croissant",icon:"🥐"},
  {id:5,name:"صمون بركر شوفان",price:1000,category:"pastry",icon:"🍔"},
  {id:6,name:"صمون كهرماني صغير",price:1000,category:"pastry",icon:"🥖"},
  {id:7,name:"صمون بركر عادي",price:1000,category:"pastry",icon:"🍔"},
  {id:8,name:"صمون شعير",price:1000,category:"pastry",icon:"🥖"},
  {id:9,name:"كرواسون سادة",price:1500,category:"croissant",icon:"🥐"},
  {id:10,name:"جرك حلاوة وقمر",price:750,category:"sweets",icon:"🍬"}
];

function money(n){
  return Number(n).toLocaleString("ar-IQ") + " د.ع";
}

function renderProducts(list){
  const box = document.getElementById("products");
  box.innerHTML = "";

  list.forEach(function(product){
    const existing = cart.find(function(x){return x.id === product.id;});
    const qty = existing ? existing.qty : 1;

    box.insertAdjacentHTML("beforeend", `
      <div class="card">
        <div class="product-img">${product.icon}</div>
        <div class="card-body">
          <h3>${product.name}</h3>
          <div class="price">${money(product.price)}</div>
          <div class="controls">
            <button class="qty-btn" onclick="changeProductQty(${product.id},-1)">−</button>
            <div class="qty" id="qty-${product.id}">${qty}</div>
            <button class="qty-btn" onclick="changeProductQty(${product.id},1)">+</button>
          </div>
          <button class="add-btn" onclick="addToCart(${product.id})">إضافة للسلة 🛒</button>
        </div>
      </div>
    `);
  });
}

function filterProducts(category,btn){
  document.querySelectorAll(".categories button").forEach(function(b){
    b.classList.remove("active");
  });
  btn.classList.add("active");

  const list = category === "all"
    ? products
    : products.filter(function(p){return p.category === category;});

  renderProducts(list);
}

function changeProductQty(id,value){
  const el = document.getElementById("qty-" + id);
  if(!el) return;
  let qty = parseInt(el.textContent,10) || 1;
  qty += value;
  if(qty < 1) qty = 1;
  el.textContent = qty;
}

function addToCart(id){
  const product = products.find(function(p){return p.id === id;});
  const qtyEl = document.getElementById("qty-" + id);
  const qty = Math.max(1,parseInt(qtyEl ? qtyEl.textContent : "1",10) || 1);
  const existing = cart.find(function(p){return p.id === id;});

  if(existing) existing.qty += qty;
  else cart.push({id:product.id,name:product.name,price:product.price,icon:product.icon,qty:qty});

  updateCartCount();
  alert("تمت إضافة المنتج إلى السلة ✅");
}

function updateCartCount(){
  const count = cart.reduce(function(sum,item){return sum + item.qty;},0);
  document.getElementById("cartCount").textContent = count;
}

function renderCart(){
  const box = document.getElementById("cartItems");
  box.innerHTML = "";

  if(cart.length === 0){
    box.innerHTML = '<div class="empty">🛒<br><br>السلة فارغة</div>';
    document.getElementById("totalPrice").textContent = "0 د.ع";
    return;
  }

  cart.forEach(function(item){
    box.insertAdjacentHTML("beforeend", `
      <div class="cart-item">
        <div class="cart-info">
          <div class="cart-name">${item.icon} ${item.name}</div>
          <div class="cart-qty">الكمية: ${item.qty}</div>
        </div>
        <div class="cart-actions">
          <button class="qty-btn" onclick="cartQty(${item.id},-1)">−</button>
          <b>${item.qty}</b>
          <button class="qty-btn" onclick="cartQty(${item.id},1)">+</button>
          <button class="delete" onclick="removeFromCart(${item.id})">🗑</button>
        </div>
      </div>
    `);
  });

  const total = cart.reduce(function(sum,item){return sum + item.price * item.qty;},0);
  document.getElementById("totalPrice").textContent = money(total);
}

function cartQty(id,value){
  const item = cart.find(function(p){return p.id === id;});
  if(!item) return;

  item.qty += value;
  if(item.qty <= 0) cart = cart.filter(function(p){return p.id !== id;});

  updateCartCount();
  renderCart();
}

function removeFromCart(id){
  cart = cart.filter(function(p){return p.id !== id;});
  updateCartCount();
  renderCart();
}

function showPage(page){
  document.querySelectorAll(".page").forEach(function(p){p.classList.remove("active");});
  const target = document.getElementById(page + "Page");
  if(!target) return;

  if(page === "checkout" && cart.length === 0){
    alert("السلة فارغة");
    document.getElementById("homePage").classList.add("active");
    return;
  }

  target.classList.add("active");
  if(page === "cart") renderCart();

  window.scrollTo({top:0,behavior:"smooth"});

  document.querySelectorAll(".nav-btn").forEach(function(b){b.classList.remove("active");});
  if(page === "home") document.querySelectorAll(".nav-btn")[0].classList.add("active");
  if(page === "cart") document.querySelectorAll(".nav-btn")[2].classList.add("active");
}

function scrollToProducts(){
  setTimeout(function(){
    document.getElementById("products").scrollIntoView({behavior:"smooth"});
  },100);
}

function getLocation(){
  const status = document.getElementById("locationStatus");
  const waze = document.getElementById("wazeLink");

  if(!navigator.geolocation){
    status.textContent = "❌ جهازك لا يدعم تحديد الموقع";
    return;
  }

  status.textContent = "📍 جاري تحديد موقعك...";

  navigator.geolocation.getCurrentPosition(
    function(position){
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      userLocation = {lat:lat,lon:lon};

      status.textContent = "✅ تم تحديد موقعك بنجاح";
      waze.href = "https://waze.com/ul?ll=" + lat + "," + lon + "&navigate=yes";
      waze.style.display = "block";
    },
    function(){
      status.textContent = "❌ تعذر تحديد الموقع، فعّل GPS وأعطِ الموقع صلاحية للمتصفح";
    },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function openWaze(){
  if(!userLocation){
    alert("حدد موقعك أولاً");
    showPage("checkout");
    return;
  }

  const url = "https://waze.com/ul?ll=" +
    userLocation.lat + "," + userLocation.lon + "&navigate=yes";

  window.open(url,"_blank");
}

function normalizePhone(phone){
  phone = phone.replace(/[^\d+]/g,"");
  if(phone.startsWith("+964")) return "0" + phone.slice(4);
  if(phone.startsWith("964")) return "0" + phone.slice(3);
  return phone;
}

function sendOrder(){
  const name = document.getElementById("customerName").value.trim();
  const phone = normalizePhone(document.getElementById("customerPhone").value.trim());
  const notes = document.getElementById("notes").value.trim();

  if(!name){alert("اكتب اسمك الكامل");return;}
  if(!phone){alert("اكتب رقم واتساب الخاص بك");return;}
  if(!/^07\d{9}$/.test(phone)){
    alert("رقم الواتساب يجب أن يكون مثل: 07876388878");
    return;
  }
  if(!userLocation){alert("حدد موقعك أولاً حتى يتم إرسال موقع Waze");return;}
  if(cart.length === 0){alert("السلة فارغة");return;}

  let orderText = "";
  cart.forEach(function(item,index){
    orderText += (index + 1) + ". " + item.name + " × " + item.qty + "\n";
  });

  const wazeUrl =
    "https://waze.com/ul?ll=" + userLocation.lat + "," + userLocation.lon + "&navigate=yes";

  /*
    الرسالة للمندوب:
    - بدون أسعار المنتجات
    - بدون الإجمالي
    - رابط Waze فقط
    - رقم الزبون الذي كتبه الزبون
  */
  const message =
`🟤 طلب جديد — سنابل السلطان

👤 الاسم: ${name}
📱 واتساب الزبون: ${phone}

🛒 الطلب:
${orderText}
📍 موقع الزبون — Waze:
${wazeUrl}

📝 ملاحظات:
${notes || "لا توجد"}

🚚 يرجى التواصل مع الزبون لتأكيد الطلب والتوصيل.`;

  const whatsappUrl =
    "https://wa.me/" + BUSINESS_WHATSAPP + "?text=" + encodeURIComponent(message);

  window.open(whatsappUrl,"_blank");
  showPage("success");
}

renderProducts(products);
updateCartCount();
</script>
</body>
</html>
